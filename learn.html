<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizzes | Hidayah Islamic and Arabic School</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#062b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="learn">

<div id="site-header"></div>

<section class="pagehead">
  <div class="wrap">
    <h1>Quizzes and games</h1>
    <p>Test yourself, earn XP and climb the leaderboard</p>
  </div>
</section>

<section class="sec">
  <div class="wrap dgrid">
    <div>
      <div class="xp">
        <span>Your level</span><br>
        <b id="lv">1</b> <span id="xpt"></span>
        <div class="bar"><i id="xpb"></i></div>
      </div>
      <div class="panel"><h3>Top students</h3><ol class="lb" id="lb"><li>Loading...</li></ol></div>
    </div>

    <div>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="ql" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))"><p>Loading quizzes...</p></div>

      <div class="panel" style="margin-top:28px;text-align:center">
        <h3>Arabic letter match</h3>
        <p style="color:var(--mut)">Match each Arabic letter with its name. Fewer moves is better.</p>
        <div class="mem" id="mem"></div>
        <p id="mv" style="font-weight:800"></p>
        <button class="btn b3" id="rs">New game</button>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  var c = await requireUser("student");
  if (!c) return;
  var g = function (id) { return document.getElementById(id); };

  var res = await Promise.all([
    sb.from("quizzes").select("id,title,subject,level,q_count,course_id,created_at"),
    sb.from("attempts").select("quiz_id,score,total,xp").eq("student_id", c.user.id),
    sb.from("enrollments").select("course_id").eq("user_id", c.user.id),
    sb.rpc("leaderboard")
  ]);
  var qs = res[0].data || [];
  var my = res[1].data || [];
  var enr = (res[2].data || []).map(function (r) { return r.course_id; });
  var lb = res[3].data || [];

  // XP and level
  var xp = my.reduce(function (s, r) { return s + (r.xp || 0); }, 0);
  g("lv").textContent = Math.floor(xp / 100) + 1;
  g("xpt").textContent = xp + " XP";
  setTimeout(function () { g("xpb").style.width = (xp % 100) + "%"; }, 200);

  // Leaderboard
  g("lb").innerHTML = lb.length
    ? lb.map(function (r) { return "<li>" + esc(r.name) + "<span>" + r.xp + " XP</span></li>"; }).join("")
    : "<li>No scores yet. Be the first.</li>";

  // Best score per quiz
  var best = {};
  my.forEach(function (r) {
    if (!r.total) return;
    var p = Math.round(r.score / r.total * 100);
    best[r.quiz_id] = Math.max(best[r.quiz_id] || 0, p);
  });

  // Helpers: which category a quiz belongs to, and sorting
  function courseOf(q) { return COURSES.find(function (x) { return x.id === q.course_id; }); }
  function catOf(q) { var co = courseOf(q); return co ? co.cat : "teacher"; }
  function mine(q) { return !!q.course_id && enr.indexOf(q.course_id) > -1; }
  function rank(q) { var i = COURSES.findIndex(function (x) { return x.id === q.course_id; }); return i < 0 ? 999 : i; }

  qs.sort(function (a, b) {
    var ma = mine(a) ? 0 : 1, mb = mine(b) ? 0 : 1;
    if (ma !== mb) return ma - mb;
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    return new Date(b.created_at) - new Date(a.created_at);
  });

  // Tabs
  var tabList = [["all", "All"]];
  if (enr.length) tabList.push(["mine", "My courses"]);
  Object.keys(CATS).forEach(function (k) { tabList.push([k, CATS[k]]); });
  tabList.push(["teacher", "Teacher quizzes"]);
  var cur = "all";

  function draw() {
    g("tabs").innerHTML = tabList.map(function (t) {
      return '<button type="button" class="tab' + (t[0] === cur ? " on" : "") + '" data-s="' + t[0] + '">' + esc(t[1]) + "</button>";
    }).join("");

    var list = qs.filter(function (q) {
      if (cur === "all") return true;
      if (cur === "mine") return mine(q);
      return catOf(q) === cur;
    });

    g("ql").innerHTML = list.length
      ? list.map(function (q) {
          var tag = best[q.id] != null ? "Best: " + best[q.id] + "%" : (mine(q) ? "Your course" : (q.level || "New"));
          return '<article class="card"><h3>' + esc(q.title) + "</h3><p>" + esc(q.subject) + " | " + q.q_count +
                 ' questions</p><span class="tag">' + esc(tag) + '</span><br><a class="btn b3" href="quiz.html?id=' + q.id + '">' +
                 (best[q.id] != null ? "Play again" : "Start") + "</a></article>";
        }).join("")
      : "<p>No quizzes in this group yet.</p>";
  }

  g("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab");
    if (b) { cur = b.dataset.s; draw(); }
  });
  draw();

  // ---------- Arabic letter match ----------
  var P = [["ا","Alif"],["ب","Ba"],["ت","Ta"],["ث","Tha"],["ج","Jim"],["ح","Ha"],["خ","Kha"],["د","Dal"]];
  var mem = g("mem");

  function game() {
    var open = [], moves = 0, done = 0, lock = false;
    var cards = [];
    P.forEach(function (p, i) { cards.push([i, p[0]]); cards.push([i, p[1]]); });
    cards.sort(function () { return Math.random() - 0.5; });
    g("mv").textContent = "";
    mem.innerHTML = cards.map(function (k, j) {
      return '<button type="button" class="mc" data-j="' + j + '"><div class="fr">?</div><div class="bk">' + k[1] + "</div></button>";
    }).join("");

    mem.onclick = function (e) {
      var el = e.target.closest(".mc");
      if (!el || lock || el.classList.contains("f")) return;
      el.classList.add("f");
      open.push(el);
      if (open.length < 2) return;
      moves++;
      var a = cards[open[0].dataset.j][0], b = cards[open[1].dataset.j][0];
      if (a === b) {
        open.forEach(function (x) { x.classList.add("done"); });
        open = [];
        if (++done === P.length) g("mv").textContent = "Well done. You finished in " + moves + " moves.";
      } else {
        lock = true;
        setTimeout(function () {
          open.forEach(function (x) { x.classList.remove("f"); });
          open = [];
          lock = false;
        }, 800);
      }
    };
  }
  game();
  g("rs").onclick = game;
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
